AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Ponte Viga — Infraestructura EC2 + DynamoDB
  EC2 (Ubuntu 24.04) sirve la app (Nginx + Node + PM2).
  DynamoDB persiste todos los datos (perfiles, sesiones, rutinas, medidas, grupos).
  S3 Bucket solo se usa para subir los artefactos del deploy.
  SSM Document despliega y reinicia sin SSH manual.

# ─────────────────────────────────────────────────────────────────────────────
# PARAMETERS
# ─────────────────────────────────────────────────────────────────────────────
Parameters:

  AppName:
    Type: String
    Default: ponte-viga
    Description: Prefijo para nombrar todos los recursos

  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: Ambiente de despliegue

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: >
      Nombre del Key Pair existente en tu cuenta AWS.
      Si creaste viga-key.pem, el nombre es "viga-key".

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]
    Description: Tipo de instancia (~$10/mes para t3.micro)

# ─────────────────────────────────────────────────────────────────────────────
# RESOURCES
# ─────────────────────────────────────────────────────────────────────────────
Resources:

  # ──────────────────────────────────────────────────────────────
  # 1. DYNAMODB — persistencia durable de todos los datos del app
  #    Una sola tabla. Cada item es una "clave" del store del cliente
  #    (profiles, groups, alejo_sessions, alejo_routines, ...).
  #    PAY_PER_REQUEST: a tu escala, dentro del free tier siempre (~$0/mes).
  #    PITR: backup continuo de los últimos 35 días.
  # ──────────────────────────────────────────────────────────────
  DataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AppName}-data-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment

  # ──────────────────────────────────────────────────────────────
  # 2. S3 BUCKET — almacena artefactos del deploy
  #    Ya NO se usa para persistir datos del usuario.
  # ──────────────────────────────────────────────────────────────
  DeploymentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AppName}-deploy-${Environment}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment

  # ──────────────────────────────────────────────────────────────
  # 3. IAM ROLE — permisos de la instancia EC2
  #    - Leer del bucket S3 de deploy
  #    - SSM (para Send Command sin SSH)
  #    - DynamoDB CRUD sobre la tabla de datos
  # ──────────────────────────────────────────────────────────────
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-ec2-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: !Sub "${AppName}-s3-deploy-read-${Environment}"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DeploymentBucket.Arn
                  - !Sub "${DeploymentBucket.Arn}/*"
        - PolicyName: !Sub "${AppName}-dynamodb-${Environment}"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt DataTable.Arn

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${AppName}-ec2-profile-${Environment}"
      Roles:
        - !Ref EC2InstanceRole

  # ──────────────────────────────────────────────────────────────
  # 4. SECURITY GROUP — puertos abiertos en el firewall
  # ──────────────────────────────────────────────────────────────
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${AppName}-sg-${Environment}"
      GroupDescription: !Sub "Ponte Viga ${Environment}: SSH + HTTP + HTTPS"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: "HTTP (Nginx / Lets Encrypt)"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
      Tags:
        - Key: Project
          Value: !Ref AppName
        - Key: Name
          Value: !Sub "${AppName}-sg-${Environment}"

  # ──────────────────────────────────────────────────────────────
  # 5. ELASTIC IP — IP fija que no cambia aunque reinicies el EC2
  # ──────────────────────────────────────────────────────────────
  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Project
          Value: !Ref AppName
        - Key: Name
          Value: !Sub "${AppName}-eip-${Environment}"

  # ──────────────────────────────────────────────────────────────
  # 6. EC2 INSTANCE — Ubuntu 24.04 LTS
  # ──────────────────────────────────────────────────────────────
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id}}"
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !GetAtt EC2SecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 10
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-server-${Environment}"
        - Key: Project
          Value: !Ref AppName
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          LOG=/var/log/ponte-viga-setup.log
          exec > >(tee -a "$LOG") 2>&1
          echo "=== Bootstrap inicio $(date) ==="

          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get upgrade -y

          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          node --version
          npm --version

          npm install -g pm2
          pm2 --version

          apt-get install -y nginx
          systemctl enable nginx

          mkdir -p /home/ubuntu/ponte-viga
          chown -R ubuntu:ubuntu /home/ubuntu/ponte-viga

          cat > /etc/nginx/sites-available/ponte-viga << 'NGINX_CONF'
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;

              location / {
                  proxy_pass http://localhost:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_cache_bypass $http_upgrade;
                  client_max_body_size 20M;
              }
          }
          NGINX_CONF

          ln -sf /etc/nginx/sites-available/ponte-viga /etc/nginx/sites-enabled/ponte-viga
          rm -f /etc/nginx/sites-enabled/default
          nginx -t
          systemctl restart nginx

          env PATH=$PATH:/usr/bin /usr/lib/node_modules/pm2/bin/pm2 startup systemd -u ubuntu --hp /home/ubuntu
          systemctl enable pm2-ubuntu

          snap install amazon-ssm-agent --classic 2>/dev/null || true
          systemctl enable amazon-ssm-agent
          systemctl start amazon-ssm-agent

          echo "=== Bootstrap completo $(date) ==="
          PUBLIC_IP=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4 || echo "desconocida")
          echo "=== IP pública: $PUBLIC_IP ==="

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      EIP: !Ref ElasticIP
      InstanceId: !Ref EC2Instance

  # ──────────────────────────────────────────────────────────────
  # 7. SSM DOCUMENT — despliega/actualiza la app
  #    Pasos:
  #      1) Descarga archivos del bucket S3
  #      2) npm install (incluye AWS SDK para DynamoDB)
  #      3) Genera ecosystem.config.js con env vars (PONTE_VIGA_TABLE, AWS_REGION)
  #      4) Migra JSON files legados a DynamoDB (idempotente, una vez por archivo)
  #      5) PM2 reload con env actualizado
  # ──────────────────────────────────────────────────────────────
  DeploySSMDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub "${AppName}-deploy-${Environment}"
      DocumentType: Command
      DocumentFormat: YAML
      UpdateMethod: NewVersion
      Content:
        schemaVersion: "2.2"
        description: "Descarga artefactos de S3, instala deps, migra a DynamoDB y reinicia PM2"
        parameters:
          BucketName:
            type: String
            default: !Sub "${AppName}-deploy-${Environment}-${AWS::AccountId}"
            description: "Nombre del bucket S3 con los archivos de la app"
          AwsRegion:
            type: String
            default: !Ref AWS::Region
            description: "Región de AWS"
          TableName:
            type: String
            default: !Sub "${AppName}-data-${Environment}"
            description: "Nombre de la tabla DynamoDB"
        mainSteps:
          - action: aws:runShellScript
            name: deployPonteViga
            inputs:
              workingDirectory: /home/ubuntu/ponte-viga
              runCommand:
                - export PATH=$PATH:/usr/local/bin:/usr/bin:/snap/bin
                - echo "=== Deploy inicio $(date) ==="
                - mkdir -p /home/ubuntu/ponte-viga
                - |
                  if ! command -v aws > /dev/null 2>&1; then
                    echo "→ Instalando AWS CLI..."
                    apt-get update -y && apt-get install -y unzip
                    curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
                    unzip -q -o /tmp/awscliv2.zip -d /tmp
                    /tmp/aws/install --update
                    rm -rf /tmp/awscliv2.zip /tmp/aws
                  fi
                - "aws s3 cp s3://{{ BucketName }}/app/index.html         /home/ubuntu/ponte-viga/ --region {{ AwsRegion }}"
                - "aws s3 cp s3://{{ BucketName }}/app/server.js          /home/ubuntu/ponte-viga/ --region {{ AwsRegion }}"
                - "aws s3 cp s3://{{ BucketName }}/app/sw.js              /home/ubuntu/ponte-viga/ --region {{ AwsRegion }}"
                - "aws s3 cp s3://{{ BucketName }}/app/package.json       /home/ubuntu/ponte-viga/ --region {{ AwsRegion }}"
                - "aws s3 cp s3://{{ BucketName }}/app/ec2-config.json    /home/ubuntu/ponte-viga/ --region {{ AwsRegion }}"
                - "aws s3 cp s3://{{ BucketName }}/app/migrate-to-dynamo.js /home/ubuntu/ponte-viga/ --region {{ AwsRegion }}"
                - chown -R ubuntu:ubuntu /home/ubuntu/ponte-viga
                - cd /home/ubuntu/ponte-viga && sudo -u ubuntu npm install --omit=dev
                - |
                  cat > /home/ubuntu/ponte-viga/ecosystem.config.js << 'ECOSYSTEM'
                  module.exports = {
                    apps: [{
                      name: 'ponte-viga',
                      script: 'server.js',
                      env: {
                        NODE_ENV: 'production',
                        PORT: '3000',
                        AWS_REGION: '{{ AwsRegion }}',
                        PONTE_VIGA_TABLE: '{{ TableName }}'
                      }
                    }]
                  };
                  ECOSYSTEM
                - chown ubuntu:ubuntu /home/ubuntu/ponte-viga/ecosystem.config.js
                - |
                  if [ -d /home/ubuntu/ponte-viga/data ] && [ -n "$(ls -A /home/ubuntu/ponte-viga/data 2>/dev/null)" ]; then
                    echo "→ Migrando JSON files existentes a DynamoDB (idempotente)..."
                    cd /home/ubuntu/ponte-viga && AWS_REGION='{{ AwsRegion }}' PONTE_VIGA_TABLE='{{ TableName }}' sudo -u ubuntu --preserve-env=AWS_REGION,PONTE_VIGA_TABLE node migrate-to-dynamo.js || echo "Migración: con errores (continuando)"
                  else
                    echo "→ Sin JSON files que migrar"
                  fi
                - |
                  if sudo -u ubuntu pm2 describe ponte-viga > /dev/null 2>&1; then
                    sudo -u ubuntu pm2 reload ecosystem.config.js --update-env
                  else
                    sudo -u ubuntu pm2 start ecosystem.config.js
                  fi
                - sudo -u ubuntu pm2 save
                - echo "=== Deploy completo $(date) ==="
                - "echo App disponible en http://$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)"

# ─────────────────────────────────────────────────────────────────────────────
# OUTPUTS
# ─────────────────────────────────────────────────────────────────────────────
Outputs:

  PublicIP:
    Description: IP pública fija de la instancia
    Value: !Ref ElasticIP
    Export:
      Name: !Sub "${AppName}-ec2-ip-${Environment}"

  AppURL:
    Description: URL de la app (HTTP)
    Value: !Sub "http://${ElasticIP}"

  InstanceId:
    Description: ID de la instancia EC2
    Value: !Ref EC2Instance
    Export:
      Name: !Sub "${AppName}-ec2-id-${Environment}"

  DeploymentBucketName:
    Description: Nombre del bucket S3 (artefactos de deploy)
    Value: !Ref DeploymentBucket
    Export:
      Name: !Sub "${AppName}-deploy-bucket-${Environment}"

  DataTableName:
    Description: Nombre de la tabla DynamoDB (persistencia)
    Value: !Ref DataTable
    Export:
      Name: !Sub "${AppName}-data-table-${Environment}"

  SSHCommand:
    Description: Comando SSH (solo diagnóstico)
    Value: !Sub "ssh -i ${KeyPairName}.pem ubuntu@${ElasticIP}"

  SSMDocumentName:
    Description: SSM Document para desplegar
    Value: !Sub "${AppName}-deploy-${Environment}"

  DeployInstructions:
    Description: Pasos para desplegar después de actualizar el stack
    Value: !Sub >-
      1) make build  2) make deploy
