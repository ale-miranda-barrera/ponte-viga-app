<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ponte Viga">
<meta name="theme-color" content="#0A0A0B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%230A0A0B'/><text x='50%25' y='55%25' font-size='112' text-anchor='middle' dominant-baseline='middle'>💪</text></svg>">
<title>Ponte Viga App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
html, body {
  margin: 0; padding: 0;
  height: 100%; width: 100%;
  background: #0A0A0B;
  overflow: hidden;
}
#root {
  width: 100vw;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.app-root {
  height: 100dvh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
/* Fix tabbar para Dynamic Island / home indicator */
.tabbar {
  padding-bottom: max(20px, env(safe-area-inset-bottom)) !important;
}
.app-loading {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100dvh; background: #0A0A0B; gap: 16px;
}
.loading-dots { display: flex; gap: 8px; }
.loading-dots span {
  width: 8px; height: 8px; border-radius: 50%; background: #ec6032;
  animation: ldot 1s ease-in-out infinite alternate;
}
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes ldot { to { opacity: 0.2; transform: scale(0.7); } }
.loading-text { color: #555; font-size: 13px; }
:root {
  --bg: #0A0A0B;
  --surface: #141416;
  --surface-2: #1C1C1F;
  --surface-3: #26262A;
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.12);
  --text: #F5F5F7;
  --text-2: #A8A8AE;
  --text-3: #8A8A90;
  --accent: oklch(0.72 0.19 40);
  --accent-2: oklch(0.62 0.22 28);
  --accent-soft: oklch(0.72 0.19 40 / 0.14);
  --good: oklch(0.78 0.15 145);
  --warn: oklch(0.74 0.17 72);
  --bad: oklch(0.66 0.20 22);
  --radius: 14px;
  --radius-sm: 10px;

  /* Design system tokens (nuevos) */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;

  --fs-xs: 11px;
  --fs-sm: 13px;
  --fs-md: 15px;
  --fs-lg: 17px;
  --fs-xl: 20px;
  --fs-2xl: 26px;
  --fs-3xl: 34px;

  --tap: 44px;

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.30);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.45);
  --shadow-focus: 0 0 0 3px oklch(0.72 0.19 40 / 0.35);

  --dur-fast: 120ms;
  --dur-med: 220ms;
  --ease: cubic-bezier(0.32, 0.72, 0.24, 1);
}

/* Reduce motion respetada */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ============================================================
   BOTONES — sistema unificado. Convivimos con .btn-primary/-link
   legacy más abajo; los nuevos usan .btn + variante.
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  min-height: var(--tap);
  padding: 0 var(--sp-5);
  border-radius: 12px;
  border: 1px solid transparent;
  font-family: inherit;
  font-size: var(--fs-md);
  font-weight: 600;
  letter-spacing: -0.01em;
  cursor: pointer;
  user-select: none;
  transition: transform var(--dur-fast) var(--ease),
              background var(--dur-fast) var(--ease),
              box-shadow var(--dur-fast) var(--ease),
              opacity var(--dur-fast) var(--ease);
  -webkit-appearance: none;
  appearance: none;
  text-decoration: none;
  white-space: nowrap;
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:focus-visible { outline: none; box-shadow: var(--shadow-focus); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-lg { min-height: 52px; font-size: var(--fs-lg); padding: 0 var(--sp-6); border-radius: 14px; }
.btn-sm { min-height: 36px; font-size: var(--fs-sm); padding: 0 var(--sp-3); border-radius: 8px; }
.btn-block { width: 100%; }

/* Variantes */
.btn-primary,
.btn.btn-primary {
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
  color: #fff;
  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.15);
}
.btn-primary:hover:not(:disabled) { filter: brightness(1.05); }

.btn-secondary,
.btn.btn-secondary {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--border-strong);
}
.btn-secondary:hover:not(:disabled) { background: var(--surface-3); }

.btn-ghost,
.btn.btn-ghost {
  background: transparent;
  color: var(--text);
  border-color: var(--border);
}
.btn-ghost:hover:not(:disabled) { background: var(--surface); }

.btn-danger,
.btn.btn-danger {
  background: oklch(0.55 0.20 22);
  color: #fff;
}
.btn-danger:hover:not(:disabled) { filter: brightness(1.08); }

.btn-link,
.btn.btn-link {
  background: transparent;
  color: var(--text-2);
  min-height: var(--tap);
  padding: 0 var(--sp-3);
}
.btn-link:hover:not(:disabled) { color: var(--text); }

/* Enfoque global para accesibilidad (todos los interactivos custom) */
button:focus-visible,
[role="button"]:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: none;
  box-shadow: var(--shadow-focus);
}

/* Todos los botones nativos: mínimo tap target y sin outline default feo */
button {
  font-family: inherit;
  color: inherit;
}

/* ============================================================
   SKELETONS — placeholders animados
   ============================================================ */
.skel {
  display: block;
  background: linear-gradient(90deg,
    var(--surface) 0%,
    var(--surface-2) 40%,
    var(--surface) 80%);
  background-size: 300% 100%;
  animation: skel-shimmer 1.4s ease-in-out infinite;
  border-radius: 8px;
}
.skel-line { height: 12px; margin: 6px 0; }
.skel-line.wide { width: 100%; }
.skel-line.mid { width: 70%; }
.skel-line.short { width: 40%; }
.skel-card { height: 92px; border-radius: 14px; margin-bottom: var(--sp-3); }
.skel-avatar { width: 64px; height: 64px; border-radius: 50%; }

@keyframes skel-shimmer {
  0% { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}

/* ============================================================
   EMPTY STATE — reutilizable
   ============================================================ */
.empty-state {
  text-align: center;
  padding: var(--sp-7) var(--sp-4);
  color: var(--text-2);
}
.empty-state-icon {
  font-size: 48px;
  opacity: 0.6;
  margin-bottom: var(--sp-3);
  display: block;
}
.empty-state-title {
  font-size: var(--fs-lg);
  font-weight: 700;
  color: var(--text);
  margin: 0 0 var(--sp-2);
}
.empty-state-text {
  font-size: var(--fs-sm);
  line-height: 1.5;
  color: var(--text-2);
  max-width: 280px;
  margin: 0 auto var(--sp-4);
}
.empty-state-action { margin-top: var(--sp-3); }

/* ============================================================
   Toasts (mejora del host existente)
   ============================================================ */
.pv-toast-host {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom) + 90px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  pointer-events: none;
  max-width: calc(100vw - 32px);
}
.pv-toast {
  background: var(--surface-3);
  color: var(--text);
  border-radius: 12px;
  padding: 12px 16px;
  min-height: var(--tap);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  box-shadow: var(--shadow-lg);
  font-size: var(--fs-sm);
  font-weight: 500;
  pointer-events: auto;
  animation: toast-in var(--dur-med) var(--ease);
  border-left: 3px solid var(--accent);
}
.pv-toast.kind-error { border-left-color: var(--bad); }
.pv-toast.kind-success { border-left-color: var(--good); }
.pv-toast.kind-warn { border-left-color: var(--warn); }
.pv-toast-action {
  background: transparent;
  border: 1px solid var(--border-strong);
  color: var(--accent);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  min-height: 32px;
}
@keyframes toast-in {
  from { opacity: 0; transform: translateX(-50%) translateY(10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* ============================================================
   Confirm modal (host existente)
   ============================================================ */
.pv-confirm-back {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  z-index: 9998;
  display: flex; align-items: center; justify-content: center;
  padding: var(--sp-4);
  animation: fade-in var(--dur-med) var(--ease);
}
.pv-confirm {
  background: var(--surface-2);
  border-radius: 18px;
  padding: var(--sp-5);
  max-width: 340px;
  width: 100%;
  animation: pop-in var(--dur-med) var(--ease);
  box-shadow: var(--shadow-lg);
}
.pv-confirm-title { font-size: var(--fs-lg); font-weight: 700; margin: 0 0 var(--sp-2); }
.pv-confirm-body { font-size: var(--fs-sm); color: var(--text-2); margin: 0 0 var(--sp-4); line-height: 1.5; }
.pv-confirm-actions { display: flex; gap: var(--sp-2); }
.pv-confirm-actions .btn { flex: 1; }

@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop-in {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}

/* ============================================================
   Fixes de tap targets críticos + accesibilidad
   ============================================================ */
.tab-btn { min-height: var(--tap); }

.ex-check,
.ex-remove {
  min-width: var(--tap);
  min-height: var(--tap);
  display: inline-flex !important;
  align-items: center;
  justify-content: center;
}

.sheet-close,
.admin-btn-del,
.admin-btn-edit {
  min-width: var(--tap);
  min-height: var(--tap);
  display: inline-flex !important;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.sheet-close:hover,
.admin-btn-del:hover,
.admin-btn-edit:hover {
  background: var(--surface-2);
  color: var(--text);
}

/* ============================================================
   Picker — refinamientos
   ============================================================ */
.picker-avatar-lg {
  width: 96px !important;
  height: 96px !important;
  font-size: 44px !important;
  margin: 0 auto var(--sp-3) !important;
  box-shadow: var(--shadow-md);
}
.picker-subtitle {
  color: var(--text-2);
  font-size: var(--fs-sm);
  text-align: center;
  margin: -8px auto var(--sp-4);
  max-width: 280px;
  line-height: 1.5;
}
.picker-input-center { text-align: center; letter-spacing: 8px; font-size: 20px; font-weight: 700; }
.picker-profile { min-height: 120px; transition: transform var(--dur-fast) var(--ease); }
.picker-profile:active { transform: scale(0.96); }
.picker-profile:disabled { opacity: 0.5; }
.picker-profile-add {}
.picker-lock { font-size: 11px; margin-left: 4px; opacity: 0.7; }

.admin-pin-error {
  color: var(--bad);
  font-size: var(--fs-sm);
  font-weight: 600;
  text-align: center;
  margin-top: var(--sp-3);
  min-height: 18px;
}
.admin-dot.loading {
  background: var(--accent) !important;
  animation: pulse-dot 0.8s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}

/* ============================================================
   Utilities de acceso rápido
   ============================================================ */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); border: 0;
}

.pv-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 999px;
  font-size: var(--fs-xs); font-weight: 700;
  background: var(--accent-soft); color: var(--accent);
}
.pv-badge-warn { background: oklch(0.74 0.17 72 / 0.15); color: var(--warn); }
.pv-badge-good { background: oklch(0.78 0.15 145 / 0.15); color: var(--good); }
.pv-badge-bad  { background: oklch(0.66 0.20 22 / 0.15);  color: var(--bad); }

/* ============================================================
   Connection banner (offline / pending sync)
   ============================================================ */
.conn-banner {
  padding: 8px 16px;
  font-size: var(--fs-sm);
  font-weight: 600;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  animation: slide-down var(--dur-med) var(--ease);
}
.conn-banner.is-offline {
  background: oklch(0.55 0.20 22);
  color: #fff;
}
.conn-banner.is-pending {
  background: oklch(0.74 0.17 72 / 0.20);
  color: var(--warn);
  border-bottom: 1px solid oklch(0.74 0.17 72 / 0.30);
}
@keyframes slide-down {
  from { transform: translateY(-100%); }
  to { transform: translateY(0); }
}


* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background: #000;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  color: var(--text);
  font-size: 15px;
  line-height: 1.4;
  letter-spacing: -0.01em;
}

.app-root {
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  font-feature-settings: 'ss01','cv11';
}

/* ===== App header ===== */
.app-header {
  padding: 10px 20px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.app-header h1 {
  font-size: 26px;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.03em;
  line-height: 1.1;
}
.header-date {
  color: var(--text-3);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  white-space: nowrap;
  margin-bottom: 4px;
}
.header-streak {
  font-size: 13px;
  color: var(--accent);
  font-weight: 700;
  display: flex; align-items:center; gap: 4px;
  background: var(--accent-soft);
  padding: 6px 10px;
  border-radius: 999px;
}

/* ===== scroll area ===== */
.app-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 16px 24px;
  -webkit-overflow-scrolling: touch;
}

/* ===== Tabbar ===== */
.tabbar {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  padding: 6px 4px 28px;
  border-top: 1px solid var(--border);
  background: rgba(10,10,11,0.92);
  backdrop-filter: blur(20px);
  flex-shrink: 0;
}
.tab-btn {
  background: none;
  border: 0;
  color: var(--text-3);
  padding: 6px 2px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  cursor: pointer;
  overflow: hidden;
  min-width: 0;
}
.tab-btn.is-active { color: var(--accent); }
.tab-icon { font-size: 19px; line-height: 1; }
.tab-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

/* ===== HOY - intro ===== */
.today-intro {
  display: flex;
  flex-direction: column;
  min-height: 100%;
}
.intro-eyebrow {
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--text-3);
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.intro-title {
  font-size: 42px;
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1.02;
  margin-bottom: 6px;
}
.intro-sub {
  color: var(--text-2);
  font-size: 17px;
  margin-bottom: 20px;
}
.intro-muscles {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 26px;
}
.muscle-chip {
  font-size: 12px;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--text-2);
  border: 1px solid var(--border);
  font-weight: 500;
}
.editor-muscles-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.editor-muscle-chip { display: inline-flex; align-items: center; gap: 6px; }
.muscle-chip-rm {
  background: transparent; border: none; color: var(--text-3);
  font-size: 15px; line-height: 1; cursor: pointer; padding: 0 2px;
  touch-action: manipulation;
}
.muscle-chip-rm:hover { color: var(--bad); }
.editor-muscle-add { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
.editor-muscle-add .editor-ex-name { flex: 1; }
.editor-muscle-add .btn-secondary { padding: 8px 16px; font-size: 18px; font-weight: 700; min-width: 44px; }

/* Actividades cardio destacadas en "Agregar ejercicio" */
.featured-cardio-label {
  font-size: 11px; font-weight: 700; color: var(--text-3);
  text-transform: uppercase; letter-spacing: 0.08em;
  margin: 6px 0 8px;
}
.featured-cardio-row {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
  margin-bottom: 14px;
}
.featured-cardio-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 12px 8px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text); cursor: pointer; touch-action: manipulation;
  transition: background .15s, border-color .15s, transform .1s;
}
.featured-cardio-btn:active { transform: scale(0.96); background: var(--accent-soft); border-color: var(--accent); }
.featured-cardio-btn:disabled { opacity: 0.4; cursor: default; }
.featured-cardio-btn.is-in { border-color: var(--accent); background: var(--accent-soft); }
.featured-cardio-icon { font-size: 26px; line-height: 1; }
.featured-cardio-name { font-size: 13px; font-weight: 700; }
.featured-cardio-kpm { font-size: 10px; color: var(--text-3); font-weight: 500; }
.intro-stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 28px;
}
.stat-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 10px;
  min-width: 0; /* permite que grid tracks se encojan */
  overflow: hidden;
}
.stat-num {
  font-size: clamp(20px, 6.2vw, 28px);
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat-unit { font-size: 11px; color: var(--text-3); margin-left: 2px; font-weight: 600; }
.stat-label {
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
  margin-top: 4px;
}

/* ===== Button ===== */
.btn-primary {
  margin-top: auto;
  background: var(--accent);
  color: #1A0A04;
  border: 0;
  border-radius: var(--radius);
  padding: 18px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: transform 0.1s, filter 0.2s;
  width: 100%;
}
.btn-primary:active { transform: scale(0.98); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:disabled {
  background: var(--surface-2);
  color: var(--text-3);
  cursor: default;
}
.btn-primary.finish { margin-top: 20px; }
.btn-primary.finish.is-ready {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  box-shadow: 0 4px 24px oklch(0.72 0.19 40 / 0.35);
}
.btn-primary.sm { padding: 12px; font-size: 14px; }

/* ===== HOY - activo ===== */
.active-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 14px;
}
.active-title {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.05;
}
.mood-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  background: var(--surface-2);
  border: 1px solid var(--border);
}
.mood-badge span { font-size: 14px; }
.mood-strong { color: var(--good); border-color: color-mix(in oklab, var(--good) 35%, transparent); }
.mood-normal { color: var(--text-2); }
.mood-sick { color: var(--warn); border-color: color-mix(in oklab, var(--warn) 35%, transparent); }

/* ===== Progress ===== */
.progress-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}
.progress-track {
  flex: 1;
  height: 6px;
  background: var(--surface-2);
  border-radius: 999px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%);
  border-radius: 999px;
  transition: width 0.4s cubic-bezier(0.2,0.8,0.2,1);
}
.progress-label {
  font-size: 12px;
  color: var(--text-2);
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  min-width: 34px;
  text-align: right;
}

/* ===== Exercise card ===== */
.exercise-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.ex-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color 0.2s, background 0.2s;
}
.ex-card.is-done {
  background: color-mix(in oklab, var(--good) 7%, var(--surface));
  border-color: color-mix(in oklab, var(--good) 30%, var(--border));
}
.ex-card.is-done .ex-name { color: var(--text-2); text-decoration: line-through; text-decoration-color: color-mix(in oklab, var(--good) 50%, transparent); }

.ex-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 14px 10px;
}
.ex-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-3);
  font-weight: 600;
  letter-spacing: 0.05em;
  padding-top: 2px;
}
.ex-info { flex: 1; min-width: 0; cursor: pointer; }
.ex-name {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 6px;
}
.ex-tag { font-size: 14px; }
.ex-sub {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 2px;
}
.ex-check {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1.5px solid var(--border-strong);
  background: none;
  display: flex; align-items: center; justify-content: center;
  color: transparent;
  font-size: 14px;
  font-weight: 700;
  transition: all 0.2s;
  flex-shrink: 0;
  cursor: pointer;
}
.ex-remove {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 0;
  background: transparent;
  color: var(--text-3);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
  flex-shrink: 0;
  margin-left: 2px;
}
.ex-remove:hover, .ex-remove:active {
  color: var(--bad, #ff6060);
  background: rgba(255,96,96,0.1);
}
.ex-check.is-checked {
  background: var(--good);
  border-color: var(--good);
  color: #0a1a0e;
}

.ex-body {
  padding: 0 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.weight-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  padding: 8px;
}
.stepper-btn {
  width: 40px; height: 40px;
  border-radius: 10px;
  border: 0;
  background: var(--surface-3);
  color: var(--text);
  font-size: 22px;
  font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, transform 0.1s;
}
.stepper-btn:active { transform: scale(0.92); background: var(--accent); color: #fff; }
.weight-display { flex: 1; text-align: center; }
.weight-num-row { display: flex; align-items: baseline; justify-content: center; gap: 2px; }
.weight-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.weight-input {
  background: transparent;
  border: none;
  border-bottom: 2px solid var(--border);
  color: var(--text);
  text-align: center;
  width: 5.5ch;
  min-width: 0;
  padding: 0 2px 2px;
  border-radius: 0;
  outline: none;
  caret-color: var(--accent);
  touch-action: manipulation;
}
.weight-input:focus { border-bottom-color: var(--accent); }
.weight-unit {
  font-size: 13px;
  color: var(--text-3);
  margin-left: 3px;
  font-weight: 500;
}
.weight-trend {
  font-size: 11px;
  margin-top: 2px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  color: var(--text-3);
}
.weight-trend.trend-up { color: var(--good); }
.weight-trend.trend-down { color: var(--warn); }

.sets-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
  gap: 6px;
}
.set-chip {
  border: 1.5px solid var(--border-strong);
  background: transparent;
  border-radius: var(--radius-sm);
  padding: 10px 4px;
  cursor: pointer;
  color: var(--text-2);
  transition: all 0.15s;
}
.set-chip:active { transform: scale(0.95); }
.set-chip.is-done {
  background: var(--accent);
  border-color: var(--accent);
  color: #1a0a04;
}
.set-reps {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 700;
  line-height: 1;
}
.set-label {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 600;
  margin-top: 2px;
  opacity: 0.7;
}

/* ===== Cardio card ===== */
.cardio-card {
  background: var(--surface);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  transition: all 0.2s;
}
.cardio-card:active { transform: scale(0.99); }
.cardio-card.is-done {
  background: color-mix(in oklab, var(--good) 7%, var(--surface));
  border-color: color-mix(in oklab, var(--good) 30%, var(--border));
  border-style: solid;
}
.cardio-icon { font-size: 24px; }
.cardio-info { flex: 1; }
.cardio-name { font-weight: 700; font-size: 15px; }

/* ===== Today - rest ===== */
.today-rest {
  text-align: center;
  padding-top: 60px;
}
.rest-badge {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--accent);
  font-weight: 700;
  background: var(--accent-soft);
  padding: 6px 12px;
  border-radius: 999px;
  margin-bottom: 20px;
}
.rest-title {
  font-size: 42px;
  font-weight: 800;
  letter-spacing: -0.035em;
}
.rest-sub {
  color: var(--text-2);
  font-size: 17px;
  margin-top: 6px;
}
.rest-quote {
  margin-top: 40px;
  color: var(--text-3);
  font-size: 13px;
  font-style: italic;
  line-height: 1.6;
  padding: 0 20px;
}

/* ===== Calendar ===== */
.cal-screen { padding-top: 4px; }
.cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.cal-nav {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--surface-2);
  border: 0;
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
}
.cal-title { text-align: center; }
.cal-month {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.cal-year { font-size: 12px; color: var(--text-3); letter-spacing: 0.06em; font-weight: 600; }
.cal-stats {
  display: flex;
  gap: 14px;
  margin-bottom: 14px;
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: 0.02em;
}
.cal-stat { display: flex; align-items: center; gap: 5px; }
.cal-stat-dot {
  width: 7px; height: 7px; border-radius: 50%;
}
.cal-stat-dot.completed { background: var(--good); }
.cal-stat-dot.partial { background: var(--warn); }
.cal-stat-dot.rest { background: var(--text-3); }
.cal-stat-icon { font-size: 14px; line-height: 1; }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 3px;
}
.cal-dow { margin-bottom: 6px; }
.cal-dow-cell {
  text-align: center;
  font-size: 10px;
  color: var(--text-3);
  font-weight: 700;
  letter-spacing: 0.1em;
  padding: 4px 0;
}
.cal-cell {
  aspect-ratio: 1;
  background: none;
  border: 1px solid transparent;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 0;
  color: var(--text-2);
  cursor: pointer;
  position: relative;
  transition: all 0.15s;
}
.cal-cell.empty { visibility: hidden; }
.cal-cell.is-future { color: var(--text-3); opacity: 0.5; cursor: default; }
.cal-cell.is-today { border-color: var(--accent); color: var(--accent); }
.cal-cell.state-completed {
  background: color-mix(in oklab, var(--good) 22%, transparent);
  border-color: color-mix(in oklab, var(--good) 60%, transparent);
  color: var(--text);
}
.cal-cell.state-partial {
  background: color-mix(in oklab, var(--warn) 18%, transparent);
  border-color: color-mix(in oklab, var(--warn) 55%, transparent);
  color: var(--text);
}
.cal-cell.state-missed { color: var(--text-3); }
.cal-day-num { font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono', monospace; opacity: 0.75; line-height: 1; }
.cal-big-icon {
  font-size: 22px;
  line-height: 1;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
  animation: cal-icon-pop 0.4s ease;
}
.cal-big-icon.partial { font-size: 18px; opacity: 0.9; }
.cal-partial-label {
  font-size: 9px; font-weight: 700; color: var(--warn);
  font-family: 'JetBrains Mono', monospace; line-height: 1;
}
.cal-rest-icon { font-size: 14px; color: var(--text-3); opacity: 0.4; line-height: 1; }
.cal-dot { width: 4px; height: 4px; border-radius: 50%; }
.cal-dot.missed { background: var(--bad); opacity: 0.5; }
@keyframes cal-icon-pop {
  from { transform: scale(0.5); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}

.cal-footer-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.mini-stat {
  text-align: center;
}
.mini-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.03em;
}
.mini-unit { font-size: 14px; color: var(--text-3); font-weight: 600; }
.mini-label {
  font-size: 10px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  margin-top: 2px;
}

/* ===== History ===== */
.hist-screen { padding-top: 4px; }
.hist-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--surface);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 16px;
}
.hist-tab {
  background: transparent;
  border: 0;
  color: var(--text-3);
  padding: 9px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.hist-tab.on {
  background: var(--surface-3);
  color: var(--text);
}
.hist-sessions { display: flex; flex-direction: column; gap: 8px; }
.hist-item {
  display: flex;
  gap: 12px;
  background: var(--surface);
  padding: 12px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  align-items: center;
}
.hist-item-btn {
  width: 100%;
  text-align: left;
  color: var(--text);
  font-family: inherit;
  font-size: inherit;
  cursor: pointer;
  transition: border-color 0.15s;
}
.hist-item-btn:hover, .hist-item-btn:active {
  border-color: var(--accent);
}
.hist-chev {
  color: var(--text-3);
  font-size: 18px;
  margin-left: 4px;
  flex-shrink: 0;
}
.hist-date {
  text-align: center;
  width: 40px;
  flex-shrink: 0;
}
.hist-day {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 800;
  line-height: 1;
}
.hist-mo {
  font-size: 9px;
  color: var(--text-3);
  font-weight: 700;
  letter-spacing: 0.1em;
  margin-top: 2px;
}
.hist-body { flex: 1; }
.hist-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.hist-meta {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 3px;
  display: flex;
  gap: 4px;
  align-items: center;
}
.hist-meta .dot-sep { opacity: 0.5; }
.hist-meta .ok { color: var(--good); }
.hist-meta .warn { color: var(--warn); }

.hist-progress { display: flex; flex-direction: column; gap: 10px; }
.prog-item {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 14px;
  border-radius: var(--radius);
  cursor: pointer;
}
.prog-head { display: flex; align-items: baseline; justify-content: space-between; }
.prog-name { font-size: 14px; font-weight: 700; }
.prog-weight {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.prog-unit { font-size: 11px; color: var(--text-3); margin-left: 2px; font-weight: 600; }
.prog-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.prog-sub { font-size: 12px; color: var(--text-3); }
.prog-trend { font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.prog-trend.trend-up { color: var(--good); }
.prog-trend.trend-down { color: var(--warn); }
.prog-trend.trend-flat { color: var(--text-3); }
.prog-spark {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 36px;
  margin-top: 10px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0;
}
.spark-bar {
  flex: 1;
  background: linear-gradient(to top, var(--accent), var(--accent-2));
  border-radius: 2px 2px 0 0;
  min-height: 4px;
  opacity: 0.75;
}
.prog-item:hover .spark-bar { opacity: 1; }

/* ===== Measures ===== */
.meas-screen { padding-top: 4px; }

/* Profile card */
.profile-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 12px;
  cursor: pointer;
}
.profile-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.profile-item { flex: 1; }
.profile-label {
  font-size: 10px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  margin-bottom: 2px;
}
.profile-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.profile-val span { font-size: 11px; color: var(--text-3); margin-left: 3px; font-weight: 500; }
.profile-edit {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3);
  font-size: 14px;
}
.profile-editor {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.profile-editor label { display: flex; flex-direction: column; gap: 4px; }
.profile-editor label > span {
  font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700;
}
.profile-editor input {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  touch-action: manipulation;
}
.profile-editor input:focus { outline: none; border-color: var(--accent); }
.seg-ctrl {
  display: flex;
  gap: 4px;
  background: var(--surface-2);
  padding: 3px;
  border-radius: 8px;
}
.seg-ctrl button {
  flex: 1;
  background: transparent;
  border: 0;
  color: var(--text-3);
  padding: 7px 4px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.seg-ctrl button.on { background: var(--surface-3); color: var(--text); }
.seg-ctrl.seg-sm button { font-size: 11px; padding: 6px 2px; }

/* IMC bar */
.bmi-bar-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 14px 12px;
  margin-bottom: 12px;
}
.bmi-bar {
  position: relative;
  height: 10px;
  border-radius: 999px;
  display: flex;
  overflow: visible;
}
.bmi-seg { height: 100%; }
.bmi-seg:first-child { border-radius: 999px 0 0 999px; }
.bmi-seg:last-child { border-radius: 0 999px 999px 0; }
.bmi-under  { background: oklch(0.70 0.12 230); }
.bmi-normal { background: oklch(0.78 0.15 145); }
.bmi-over   { background: oklch(0.74 0.17 72); }
.bmi-ob1    { background: oklch(0.70 0.19 45); }
.bmi-ob2    { background: oklch(0.62 0.22 28); }
.bmi-marker {
  position: absolute;
  top: -18px;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.bmi-marker-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 800;
  color: var(--text);
  background: var(--surface-3);
  padding: 2px 6px;
  border-radius: 6px;
}
.bmi-marker-pin {
  width: 2px;
  height: 16px;
  background: var(--text);
}
.bmi-ticks {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  padding: 0 2px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-3);
}

/* IMC badge */
.imc-badge {
  display: inline-block;
  margin-top: 6px;
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 999px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.imc-under  { background: color-mix(in oklab, oklch(0.70 0.12 230) 20%, transparent); color: oklch(0.85 0.12 230); }
.imc-normal { background: color-mix(in oklab, var(--good) 20%, transparent); color: var(--good); }
.imc-over   { background: color-mix(in oklab, var(--warn) 20%, transparent); color: var(--warn); }
.imc-ob1    { background: color-mix(in oklab, oklch(0.70 0.19 45) 22%, transparent); color: oklch(0.80 0.15 45); }
.imc-ob2, .imc-ob3 { background: color-mix(in oklab, var(--bad) 22%, transparent); color: oklch(0.78 0.17 22); }

/* Calorie card */
.cal-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.cal-head { display: flex; justify-content: space-between; align-items: baseline; }
.cal-head-title { font-size: 13px; font-weight: 700; }
.cal-head-sub { font-size: 10px; color: var(--text-3); letter-spacing: 0.04em; }
.cal-main { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
.cal-main-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 38px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--accent);
}
.cal-main-unit { font-size: 12px; color: var(--text-3); font-weight: 600; }
.cal-sub { margin-top: 4px; font-size: 11px; color: var(--text-3); }
.cal-bmr strong { color: var(--text); font-family: 'JetBrains Mono', monospace; font-weight: 700; }
.cal-goals {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 14px;
}
.cal-goal {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
}
.cal-goal.deficit { border-color: color-mix(in oklab, var(--good) 30%, var(--border)); }
.cal-goal.surplus { border-color: color-mix(in oklab, var(--warn) 30%, var(--border)); }
.cal-goal-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-3);
  font-weight: 700;
  margin-bottom: 4px;
  display: flex; justify-content: space-between;
}
.cal-goal-label span {
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0;
}
.cal-goal.deficit .cal-goal-label span { color: var(--good); }
.cal-goal.surplus .cal-goal-label span { color: var(--warn); }
.cal-goal-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.cal-goal-num span { font-size: 11px; color: var(--text-3); margin-left: 3px; font-weight: 500; }

.meas-card.sm { padding: 12px 14px; }
.meas-num.sm { font-size: 24px; }
/* Weight range bar */
.wrange {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 14px 10px;
  margin-bottom: 12px;
}
.wrange-head { display: flex; align-items: center; justify-content: space-between; }
.wrange-title { font-size: 13px; font-weight: 700; }
.wrange-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 999px;
}
.wrange-badge.wrange-good   { background: color-mix(in oklab, var(--good) 20%, transparent); color: var(--good); }
.wrange-badge.wrange-warn   { background: color-mix(in oklab, var(--warn) 22%, transparent); color: var(--warn); }
.wrange-badge.wrange-danger { background: color-mix(in oklab, var(--bad) 22%, transparent); color: oklch(0.78 0.17 22); }
.wrange-sub { font-size: 12px; color: var(--text-3); margin-top: 4px; }
.wrange-sub strong { color: var(--text); font-family: 'JetBrains Mono', monospace; font-weight: 700; }
.wrange-bar {
  position: relative;
  height: 10px;
  border-radius: 999px;
  background: var(--surface-2);
  margin: 28px 0 8px;
  overflow: visible;
}
.wrange-seg { position: absolute; top: 0; height: 100%; }
.wrange-seg:first-of-type { border-radius: 999px 0 0 999px; }
.wrange-seg:nth-of-type(5) { border-radius: 0 999px 999px 0; }
.wrange-seg-good   { background: oklch(0.78 0.15 145); }
.wrange-seg-warn   { background: oklch(0.74 0.17 72); }
.wrange-seg-danger { background: oklch(0.66 0.20 22); }
.wrange-marker {
  position: absolute;
  top: -22px;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}
.wrange-marker-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 800;
  color: var(--text);
  background: var(--surface-3);
  padding: 2px 6px;
  border-radius: 6px;
  white-space: nowrap;
}
.wrange-marker-pin {
  width: 2px;
  height: 18px;
  background: var(--text);
  margin-top: 2px;
}
.wrange-ticks {
  position: relative;
  height: 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-3);
}
.wrange-ticks > span:first-child { position: absolute; left: 0; }
.wrange-ticks > span:last-child { position: absolute; right: 0; }
.wrange-ticks .tick-key {
  position: absolute;
  transform: translateX(-50%);
  color: var(--good);
  font-weight: 700;
}
.meas-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.meas-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.meas-label {
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  margin-bottom: 10px;
}
.meas-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
}
.meas-unit { font-size: 14px; color: var(--text-3); margin-left: 3px; font-weight: 600; }
.meas-delta {
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  margin-top: 6px;
  font-weight: 700;
}
.meas-delta.good { color: var(--good); }
.meas-delta.warn { color: var(--warn); }

.meas-form {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 20px;
}
.meas-form-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
.meas-form-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 10px;
  margin-bottom: 12px;
}
.meas-form-row label { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.meas-form-row span {
  font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;
}
.meas-form-row input {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
}
.meas-form-row input:focus { outline: none; border-color: var(--accent); }

.meas-hist-title {
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  margin-bottom: 10px;
}
.meas-hist-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.meas-hist-date { color: var(--text-3); font-family: 'JetBrains Mono', monospace; }
.meas-hist-vals { display: flex; gap: 14px; color: var(--text-2); }
.meas-hist-vals strong { color: var(--text); font-family: 'JetBrains Mono', monospace; font-weight: 700; margin-right: 1px; }

/* ===== Modals ===== */
.modal-backdrop {
  position: fixed; /* fixed viewport, no anclado a scroll parent */
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  backdrop-filter: blur(6px);
  animation: fadein 0.2s ease-out;
}
/* Backdrop fijo a la viewport — para modales dentro de contenedores scrolleables */
.modal-backdrop-fixed {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  backdrop-filter: blur(6px);
  animation: fadein 0.2s ease-out;
}
@keyframes fadein { from { opacity:0 } to { opacity:1 } }
@keyframes slideup { from { transform: translateY(100%) } to { transform: translateY(0) } }
.modal-sheet, .detail-sheet {
  background: var(--surface);
  border-radius: 22px 22px 0 0;
  padding: 10px 22px 34px;
  animation: slideup 0.3s cubic-bezier(0.2,0.8,0.2,1);
  max-height: 86%;
  overflow-y: auto;
  border-top: 1px solid var(--border);
}
.modal-handle {
  width: 36px; height: 4px;
  background: var(--surface-3);
  border-radius: 999px;
  margin: 6px auto 18px;
}
/* Botón X universal para cerrar modales */
.sheet-close {
  position: absolute;
  top: 14px;
  right: 16px;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--surface-3);
  border: 0;
  color: var(--text-2);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 1;
  flex-shrink: 0;
}
.sheet-close:active { transform: scale(0.88); }
/* Para que los sheets posicionen el X correctamente */
.modal-sheet, .detail-sheet { position: relative; }
.modal-title { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 4px; }
.modal-sub { color: var(--text-3); font-size: 13px; margin-bottom: 20px; }
.mood-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.mood-opt {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
}
.mood-opt:hover { border-color: var(--border-strong); background: var(--surface-3); }
.mood-opt:active { transform: scale(0.98); }
.mood-opt .mood-icon { font-size: 32px; }
.mood-opt .mood-label { font-size: 16px; font-weight: 700; color: var(--text); }
.mood-opt .mood-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }

/* detail */
.detail-head {
  padding-bottom: 18px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.detail-tag {
  font-size: 11px;
  color: var(--accent);
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.detail-name { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
.detail-sub { font-size: 13px; color: var(--text-3); margin-top: 2px; }
.detail-target {
  margin-top: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-2);
  background: var(--surface-2);
  display: inline-block;
  padding: 6px 10px;
  border-radius: 8px;
}
.detail-section-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-3);
  font-weight: 700;
  margin-bottom: 10px;
}
.detail-history { display: flex; flex-direction: column; gap: 6px; }
.detail-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: var(--surface-2);
  border-radius: 10px;
}
.detail-row-date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--text-3);
  width: 54px;
}
.detail-row-body { flex: 1; display: flex; gap: 10px; align-items: baseline; }
.detail-row-w { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 16px; }
.detail-row-meta { font-size: 12px; color: var(--text-3); }
.detail-row-mood { font-size: 18px; }
.set-dot {
  width: 24px; height: 24px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size: 12px; color: var(--text-3);
  border: 1px solid var(--border-strong);
}
.set-dot.is-done { background: var(--good); color: #0a1a0e; border-color: var(--good); font-weight: 700; }
.set-chip-partial {
  background: color-mix(in oklab, var(--warn) 22%, transparent);
  border: 1px solid var(--warn);
  color: var(--warn);
  padding: 3px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  display: flex; align-items: center; justify-content: center;
  min-width: 36px;
}

.empty { text-align: center; padding: 30px; color: var(--text-3); font-size: 13px; }

/* ===== Tweaks ===== */
.tweaks-panel {
  position: absolute;
  right: 12px;
  bottom: 100px;
  z-index: 20;
  width: 260px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  font-size: 12px;
}
.tweaks-title { font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px; font-size: 13px; }
.tweak-row { margin-bottom: 10px; }
.tweak-row label { display: block; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; font-weight: 700; }
.tweak-row input[type="color"] { width: 100%; height: 30px; background: transparent; border: 1px solid var(--border); border-radius: 8px; }
.tweak-row select, .tweak-row input[type="range"] { width: 100%; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px; }
.tweak-reset { background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text); padding: 8px; border-radius: 8px; width: 100%; cursor: pointer; font-size: 12px; }

/* ===== Buttons secondary / link ===== */
.btn-success {
  background: var(--good);
  color: #051a08;
  border: 0;
  border-radius: var(--radius);
  padding: 18px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
  cursor: pointer;
  width: 100%;
  transition: transform 0.1s, filter 0.2s;
  touch-action: manipulation;
}
.btn-success:active { transform: scale(0.98); }
.btn-success:hover { filter: brightness(1.08); }

.btn-secondary {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 14px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
  transition: background 0.15s;
}
.btn-secondary:hover { background: var(--surface-3); }
.btn-secondary:active { transform: scale(0.98); }

.btn-link {
  background: none;
  border: 0;
  color: var(--text-3);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  padding: 10px;
  width: 100%;
  text-align: center;
}
.btn-link:hover { color: var(--text-2); }

.icon-btn {
  background: var(--surface-2);
  border: 0;
  color: var(--text-3);
  width: 32px; height: 32px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn:active { transform: scale(0.88); background: var(--surface-3); }

/* ===== Routine Editor ===== */
.editor-sheet { max-height: 92%; }

.editor-head {
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.editor-title-input {
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--border-strong);
  color: var(--text);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.03em;
  padding: 4px 0 6px;
  width: 100%;
  margin-bottom: 6px;
}
.editor-title-input:focus { outline: none; border-bottom-color: var(--accent); }
.editor-sub-input {
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--border);
  color: var(--text-2);
  font-size: 14px;
  padding: 2px 0 4px;
  width: 100%;
}
.editor-sub-input:focus { outline: none; border-bottom-color: var(--accent); }

.editor-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.editor-row {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
}
.editor-row-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.editor-ex-name {
  flex: 1;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--border-strong);
  color: var(--text);
  font-size: 15px;
  font-weight: 700;
  padding: 2px 0 4px;
}
.editor-ex-name:focus { outline: none; border-bottom-color: var(--accent); }
.editor-ex-sub {
  width: 100%;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--border);
  color: var(--text-2);
  font-size: 12px;
  padding: 2px 0 4px;
  margin-bottom: 8px;
}
.editor-ex-sub:focus { outline: none; border-bottom-color: var(--accent); }
.editor-rm {
  background: none;
  border: 0;
  color: var(--text-3);
  font-size: 14px;
  cursor: pointer;
  padding: 4px;
  flex-shrink: 0;
}
.editor-rm:hover { color: var(--bad); }
.editor-nums {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.editor-nums label {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.editor-nums label > span {
  font-size: 9px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
}
.editor-nums input, .editor-nums select {
  background: var(--surface-3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 4px;
  border-radius: 6px;
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  text-align: center;
  width: 100%;
}
.editor-nums input:focus, .editor-nums select:focus { outline: none; border-color: var(--accent); }
.editor-move {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  justify-content: flex-end;
}
.editor-move button {
  background: var(--surface-3);
  border: 0;
  color: var(--text-3);
  width: 28px; height: 28px;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
}
.editor-move button:disabled { opacity: 0.3; cursor: default; }
.editor-move button:not(:disabled):hover { color: var(--text); background: var(--border-strong); }

/* measure form 3-column */
.meas-form-row.tri {
  grid-template-columns: repeat(3, 1fr);
}

/* profile editor row */
.profile-editor-row { display: flex; gap: 10px; }
.profile-editor-row .seg { flex: 1; }

/* ===== Exercise card: personal best hint ===== */
.ex-pb {
  font-size: 11px;
  color: var(--accent);
  font-weight: 700;
  margin-top: 2px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.01em;
}
.ex-pb.ex-pb-dim { color: var(--text-3); font-weight: 500; font-family: 'Inter', sans-serif; }

/* ===== Cardio card: time controls ===== */
.cardio-time-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.cardio-time-btn {
  width: 32px; height: 32px;
  border-radius: 8px;
  border: 0;
  background: var(--surface-3);
  color: var(--text);
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, transform 0.1s;
}
.cardio-time-btn:active { transform: scale(0.9); background: var(--accent); color: #fff; }
.cardio-time-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 700;
  min-width: 52px;
  text-align: center;
}
.cardio-presets {
  display: flex;
  gap: 4px;
  margin-left: 4px;
}
.cardio-preset {
  border: 1px solid var(--border-strong);
  background: transparent;
  color: var(--text-3);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  transition: all 0.15s;
}
.cardio-preset.on {
  background: var(--accent);
  border-color: var(--accent);
  color: #1a0a04;
}
.cardio-preset:active { transform: scale(0.95); }

/* ===== Save feedback button ===== */
.btn-primary.btn-saved {
  background: var(--good);
  color: #0a1a0e;
}

/* ===== Loading screen ===== */
.app-loading {
  height: 100dvh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.loading-dots {
  display: flex;
  gap: 7px;
}
.loading-dots span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse-dot 1.2s ease-in-out infinite;
}
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse-dot {
  0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
  40% { opacity: 1; transform: scale(1); }
}
.loading-text {
  font-size: 13px;
  color: var(--text-3);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* ===== Profile Picker ===== */
.picker-screen {
  height: 100dvh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
  gap: 22px;
}
.picker-logo { font-size: 44px; }
.picker-title {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--text);
  text-align: center;
}
.picker-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 18px;
  max-width: 340px;
}
.picker-profile {
  background: none;
  border: 0;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  -webkit-tap-highlight-color: transparent;
}
.picker-avatar {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  border: 3px solid transparent;
  transition: transform 0.15s, border-color 0.15s;
}
.picker-profile:active .picker-avatar { transform: scale(0.88); }
.picker-profile:hover .picker-avatar { border-color: rgba(255,255,255,0.35); }
.picker-add {
  background: var(--surface-2);
  border: 2px dashed var(--border-strong);
  color: var(--text-3);
  font-size: 28px;
  font-weight: 300;
}
.picker-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  max-width: 80px;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.picker-section-label {
  font-size: 10px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  align-self: flex-start;
}
.picker-create {
  width: 100%;
  max-width: 300px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.picker-create-preview {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 14px 0 4px;
}
.picker-input {
  background: var(--surface);
  border: 1.5px solid var(--border-strong);
  border-radius: var(--radius);
  color: var(--text);
  padding: 14px 16px;
  font-size: 18px;
  font-weight: 700;
  text-align: center;
  width: 100%;
  font-family: inherit;
}
.picker-input:focus { outline: none; border-color: var(--accent); }
.picker-input-error { border-color: #e74c3c !important; }
.picker-pin-error { color: #e74c3c; font-size: 13px; text-align: center; margin-top: -4px; }
.picker-emoji-row {
  display: flex;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
}
.picker-emoji-btn {
  background: var(--surface-2);
  border: 1.5px solid transparent;
  border-radius: 10px;
  font-size: 22px;
  width: 42px;
  height: 42px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.picker-emoji-btn.on { border-color: var(--accent); background: var(--accent-soft); }
.picker-color-row {
  display: flex;
  justify-content: center;
  gap: 10px;
}
.picker-color-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2.5px solid transparent;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
}
.picker-color-btn.on { border-color: var(--text); transform: scale(1.25); }
.picker-actions { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }

/* Tabs para picker de ejercicios */
.picker-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}
.picker-tab {
  flex: 1;
  padding: 8px 10px;
  background: var(--surface-2);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-2);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.picker-tab.on {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--text);
}
/* Indicador de origen en pool de ejercicios */
.pool-source {
  color: var(--text-3);
  font-size: 11px;
  margin-left: 4px;
}

/* Leaderboard */
.lb-wrap {
  margin-top: 24px;
  width: 100%;
  border-top: 1px solid var(--border);
  padding-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.lb-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
  text-align: center;
  margin-bottom: 2px;
}
.lb-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.lb-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.lb-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  min-width: 60px;
  flex-shrink: 0;
}
.lb-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.lb-badge {
  font-size: 11px;
  font-weight: 600;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 3px 8px;
  color: var(--text);
  white-space: nowrap;
}
.lb-empty {
  font-size: 11px;
  color: var(--text-dim);
}

/* Profile avatar button in header */
.profile-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.18);
  font-size: 19px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s, box-shadow 0.15s;
  flex-shrink: 0;
  touch-action: manipulation;
  -webkit-tap-highlight-color: rgba(255,255,255,0.2);
  position: relative;
  z-index: 5;
}
.profile-btn::after {
  content: '↻'; position: absolute; bottom: -3px; right: -3px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--surface-3); color: var(--text-2);
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--bg);
}
.profile-btn:active { transform: scale(0.88); }
.profile-btn:hover { box-shadow: 0 0 0 2px rgba(255,255,255,0.3); }

/* ===== Semana ===== */
.week-screen {
  padding-top: 4px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.week-eyebrow {
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--text-3);
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.week-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.week-card.week-today {
  border-color: var(--accent);
  background: color-mix(in oklab, var(--accent) 6%, var(--surface));
}
.week-card.week-rest { opacity: 0.6; }
.week-card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
}
.week-day-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-3);
  min-width: 76px;
  flex-shrink: 0;
}
.week-today .week-day-pill { color: var(--accent); }
.week-today-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}
.week-card-title {
  flex: 1;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.week-card-body {
  padding: 0 14px 14px;
  border-top: 1px solid var(--border);
}
.week-card-sub {
  font-size: 12px;
  color: var(--text-3);
  padding-top: 10px;
  margin-bottom: 6px;
}
.week-muscles-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding-top: 8px;
  margin-bottom: 10px;
}
.week-ex-table {
  display: flex;
  flex-direction: column;
}
.week-ex-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.week-ex-row:last-child { border-bottom: none; }
.week-ex-i {
  font-size: 10px;
  color: var(--text-3);
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  width: 20px;
  flex-shrink: 0;
}
.week-ex-name { flex: 1; color: var(--text); font-weight: 500; }
.week-ex-spec {
  font-size: 11px;
  color: var(--text-3);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  white-space: nowrap;
}
.week-cardio-row .week-ex-name { color: var(--text-2); font-style: italic; }
.week-rest-body {
  padding: 8px 14px 14px;
  font-size: 13px;
  color: var(--text-3);
}

/* ===== Line Chart ===== */
.prog-chart {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.detail-chart-wrap {
  margin-bottom: 16px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 10px 2px;
}
.chart-one {
  font-size: 12px;
  color: var(--text-3);
  font-family: 'JetBrains Mono', monospace;
  padding: 6px 0;
}

/* ===== Tweaks danger button ===== */
.tweak-danger {
  background: color-mix(in oklab, var(--bad) 20%, var(--surface-2));
  border-color: color-mix(in oklab, var(--bad) 35%, transparent);
  color: oklch(0.78 0.17 22);
}


/* ===== Placeholder palido en inputs de medidas ===== */
.meas-form-row input::placeholder {
  color: var(--text-3);
  opacity: 0.55;
  font-weight: 400;
}
.meas-form-row input:focus {
  caret-color: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}

/* ===== Intro secondary buttons ===== */
.intro-secondary-btns {
  display: flex;
  flex-direction: column;
  gap: 4px;
  align-items: center;
  margin-top: 4px;
}
.hint-text {
  font-size: 12px;
  color: var(--text-3);
  text-align: center;
  margin-top: 8px;
}

/* ===== Swap routine modal ===== */
.swap-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.swap-option {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 14px;
  cursor: pointer; text-align: left; transition: border-color .15s, background .15s;
}
.swap-option:active { background: var(--surface-3); }
.swap-option-day { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; min-width: 52px; font-weight: 700; }
.swap-option-info { flex: 1; min-width: 0; }
.swap-option-title { font-size: 15px; font-weight: 700; color: var(--text); }
.swap-option-sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.swap-arrow { font-size: 20px; color: var(--text-3); }

/* ===== ActivityCard ===== */
.activity-card {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; transition: opacity .25s;
}
.activity-card.is-done { opacity: 0.55; }
.activity-icon { font-size: 24px; width: 32px; text-align: center; flex-shrink: 0; }
.activity-info { flex: 1; min-width: 0; }
.activity-name { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.activity-val-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.activity-cal { font-size: 11px; color: var(--text-3); background: var(--surface-3); padding: 2px 7px; border-radius: 8px; margin-left: 4px; }
.activity-val-input {
  width: 56px; min-width: 56px; padding: 6px 8px; border-radius: 10px;
  background: var(--surface-3); border: 1px solid var(--border); color: var(--text);
  font-size: 16px; font-weight: 700; text-align: center;
  caret-color: var(--accent); outline: none; -webkit-appearance: none;
  font-family: inherit;
}
.activity-val-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.activity-val-unit { font-size: 13px; color: var(--text-2); font-weight: 600; margin-left: -4px; }

/* ===== Swap banner ===== */
.swap-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--accent-soft); border: 1px solid var(--accent);
  color: var(--text); border-radius: 12px; padding: 8px 12px;
  font-size: 13px; font-weight: 600; margin-bottom: 12px;
}
.swap-banner-clear {
  background: transparent; border: none; color: var(--accent);
  font-size: 12px; font-weight: 700; padding: 4px 8px; cursor: pointer;
  border-radius: 8px;
}

/* ===== Completion modal ===== */
.completion-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.75);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 300; animation: fadeIn .2s ease;
}
.completion-sheet {
  position: relative;
  background: var(--surface); border-radius: 28px 28px 0 0;
  padding: 32px 24px 48px; width: 100%; max-width: 480px;
  text-align: center; animation: slideUp .3s cubic-bezier(.34,1.56,.64,1);
}
.completion-trophy { font-size: 56px; margin-bottom: 12px; animation: bounceIn .5s cubic-bezier(.34,1.56,.64,1) .1s both; }
@keyframes bounceIn { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.completion-title { font-size: 26px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
.completion-routine { font-size: 14px; color: var(--text-2); margin-bottom: 20px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.completion-stats { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--surface-2); border-radius: 16px; padding: 16px 20px; margin-bottom: 16px; }
.completion-stat { text-align: center; }
.completion-stat-num { font-size: 28px; font-weight: 800; color: var(--accent); font-family: 'JetBrains Mono', monospace; line-height: 1; }
.completion-stat-label { font-size: 11px; color: var(--text-3); margin-top: 4px; text-transform: uppercase; letter-spacing: .06em; }
.completion-divider { width: 1px; height: 40px; background: var(--border); }
.completion-pr { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-radius: 12px; padding: 8px 16px; font-size: 13px; font-weight: 700; margin-bottom: 12px; }
.completion-sub-msg { font-size: 13px; color: var(--text-3); margin-bottom: 20px; }

/* ===== DaySummaryModal – comparaciones por ejercicio ===== */
.summary-comparisons { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.summary-cmp-row {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--surface-2); border-radius: 10px; padding: 10px 14px;
}
.summary-cmp-name { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.summary-cmp-val { font-size: 13px; font-weight: 600; margin-left: 8px; white-space: nowrap; }
.summary-cmp-new  { color: var(--accent); }
.summary-cmp-up   { color: var(--good); }
.summary-cmp-down { color: var(--bad); }
.summary-cmp-same { color: var(--text-3); }

/* ===== Progreso: banner demo ===== */
.progress-demo-banner {
  display: flex; gap: 12px;
  background: color-mix(in oklab, var(--accent) 12%, var(--surface-2));
  border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent);
  border-radius: 14px; padding: 14px; margin-bottom: 14px;
}
.demo-banner-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
.demo-banner-body { flex: 1; min-width: 0; }
.demo-banner-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
.demo-banner-sub { font-size: 12px; color: var(--text-2); line-height: 1.4; }
.prog-item-demo { opacity: .72; }

/* ===== Grupos / amigos ===== */
.friends-section { margin-top: 20px; padding: 16px; background: var(--surface-2); border-radius: 16px; border: 1px solid var(--border); }
.friends-title { font-size: 12px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }
.friends-group { margin-bottom: 14px; }
.friends-group:last-child { margin-bottom: 0; }
.friends-code { font-size: 11px; color: var(--accent); font-weight: 700; margin-bottom: 8px; letter-spacing: .06em; }
.friends-avatars { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.friend-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 2px solid rgba(255,255,255,.15); }
.friend-link { font-size: 18px; }
.friends-names { font-size: 12px; color: var(--text-3); }

/* ===== Group join step ===== */
.group-mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.group-mode-tab { flex: 1; padding: 8px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
.group-mode-tab.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.group-code-preview { font-size: 13px; color: var(--text-2); margin-top: 8px; padding: 8px 12px; background: var(--surface-2); border-radius: 10px; text-align: center; }

.group-suggestions { margin-top: 14px; }
.group-suggestions-label { font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.group-suggestions-list { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow-y: auto; }
.group-suggestion-chip { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); font-size: 12px; cursor: pointer; transition: all .12s; text-align: left; }
.group-suggestion-chip:hover, .group-suggestion-chip:active { background: var(--accent-soft); border-color: var(--accent); }
.gs-code { font-weight: 700; color: var(--accent); flex-shrink: 0; }
.gs-name { color: var(--text-2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gs-count { font-size: 11px; color: var(--text-3); flex-shrink: 0; }

/* ===== Routine editor - activities ===== */
.editor-act-row { background: color-mix(in oklab, var(--accent) 8%, var(--surface-2)); }
.editor-act-icon { font-size: 20px; margin-right: 8px; }
.editor-act-name { font-size: 14px; font-weight: 700; color: var(--text); flex: 1; }
.editor-act-vals { display: flex; gap: 12px; margin-top: 8px; }
.editor-act-vals label { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.editor-act-input-row { display: flex; align-items: center; gap: 6px; }
.editor-act-unit { font-size: 12px; color: var(--text-3); white-space: nowrap; }

/* ===== Activity catalog modal ===== */
.activity-catalog { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.activity-catalog-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 14px;
  cursor: pointer; text-align: left; transition: border-color .15s, background .15s;
}
.activity-catalog-item:active { background: var(--surface-3); }
.act-cat-icon { font-size: 24px; width: 32px; text-align: center; }
.act-cat-info { flex: 1; }
.act-cat-name { font-size: 14px; font-weight: 700; color: var(--text); }
.act-cat-meta { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.act-type-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.act-type-btn { padding: 6px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); font-size: 12px; font-weight: 600; cursor: pointer; }
.act-type-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* ===== today.jsx: bodyweight + last session + cals + pop animation ===== */
.bodyweight-row { display: flex; justify-content: center; }
.bodyweight-label { font-size: 14px; color: var(--text-2); background: var(--surface-3); border-radius: 10px; padding: 8px 20px; font-weight: 600; }
.intro-last-session { font-size: 13px; color: var(--text-2); text-align: center; margin-bottom: 14px; }
.intro-last-ok { color: var(--good); }
.intro-last-partial { color: var(--warn); }
.active-cals { font-size: 12px; color: var(--text-3); text-align: right; padding: 2px 4px 8px; }
@keyframes pop-done { 0% { transform: scale(1); } 40% { transform: scale(1.04); } 70% { transform: scale(.98); } 100% { transform: scale(1); } }
.ex-card.just-done { animation: pop-done .55s cubic-bezier(.34,1.56,.64,1); }

/* ===== Mejora 3: greeting ===== */
.header-greeting { font-size: 12px; color: var(--text-3); margin-bottom: 1px; font-weight: 500; }

/* ===== Mejora 6: scroll shadow ===== */
.app-header { transition: box-shadow .2s; }
.app-header.scrolled { box-shadow: 0 4px 20px rgba(0,0,0,.5); }

/* ===== Mejora 7: tab fade-in ===== */
/* Sin transform en hijos del scroll: crea containing block que rompe modales fixed. */
@keyframes tab-enter { from { opacity: 0; } to { opacity: 1; } }
.app-scroll > * { animation: tab-enter .22s cubic-bezier(.4,0,.2,1) both; }

/* ─── Proyección card ────────────────────────────────────────────── */
.proj-card {
  background: linear-gradient(145deg, var(--surface-2), var(--surface));
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  display: flex;
  flex-direction: column;

.proj-progress { display: flex; flex-direction: column; gap: 4px; }
