/* ===== Mejora 9: week stats ===== */
.week-card-stats { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-3); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }

/* ===== Mejora 10: history volume ===== */
.hist-vol { font-size: 11px; color: var(--text-3); font-family: 'JetBrains Mono', monospace; }

/* ===== Admin panel ===== */
.admin-pin-wrap { display: flex; flex-direction: column; min-height: 100dvh; background: var(--bg); }
.admin-pin-topbar { padding: 16px 20px 0; }
.admin-back-link { color: var(--text-3); font-size: 14px; font-weight: 600; text-decoration: none; }
.admin-back-link:hover { color: var(--accent); }
.admin-pin-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 16px; }
.admin-pin-logo { font-size: 48px; }
.admin-pin-title { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; }
.admin-pin-sub { font-size: 13px; color: var(--text-3); }
.admin-pin-dots { display: flex; gap: 14px; margin: 8px 0; }
.admin-pin-dots.shake { animation: pin-shake .5s cubic-bezier(.36,.07,.19,.97); }
@keyframes pin-shake { 10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)} 30%,50%,70%{transform:translateX(-6px)} 40%,60%{transform:translateX(6px)} }
.admin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); background: transparent; transition: background .15s, border-color .15s; }
.admin-dot.on { background: var(--accent); border-color: var(--accent); }
.admin-numpad { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; }
.numpad-key { width: 72px; height: 72px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); font-size: 22px; font-weight: 700; cursor: pointer; font-family: 'JetBrains Mono', monospace; touch-action: manipulation; }
.numpad-key:active { background: var(--accent); color: #fff; transform: scale(0.94); }
.numpad-key.invisible { visibility: hidden; }

.admin-panel { display: flex; flex-direction: column; min-height: 100dvh; background: var(--bg); }
.admin-header { display: flex; align-items: center; gap: 12px; padding: 16px 20px 12px; border-bottom: 1px solid var(--border); }
.admin-header-title { flex: 1; font-size: 17px; font-weight: 800; letter-spacing: -0.02em; text-align: center; }
.admin-sync-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); font-size: 18px; cursor: pointer; touch-action: manipulation; }
.admin-tabs { display: flex; border-bottom: 1px solid var(--border); }
.admin-tab { flex: 1; padding: 12px 0; font-size: 13px; font-weight: 700; color: var(--text-3); background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; touch-action: manipulation; transition: color .15s, border-color .15s; }
.admin-tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.admin-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px 40px; }
.admin-section { display: flex; flex-direction: column; gap: 10px; }
.admin-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 12px; }
.admin-empty { text-align: center; color: var(--text-3); font-size: 14px; padding: 40px 0; }

.admin-profile-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
.admin-profile-row.editing { flex-direction: column; align-items: stretch; }
.admin-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.admin-profile-info { flex: 1; min-width: 0; }
.admin-profile-name { font-size: 15px; font-weight: 700; }
.admin-profile-groups { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.admin-group-tag { font-size: 11px; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 1px 6px; font-weight: 600; }
.admin-dim { font-size: 11px; color: var(--text-3); }
.admin-row-actions { display: flex; gap: 6px; align-items: center; }
.admin-btn-edit { padding: 6px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); font-size: 14px; cursor: pointer; touch-action: manipulation; }
.admin-btn-del { padding: 6px 10px; border-radius: 8px; background: transparent; border: 1px solid var(--border); color: var(--bad); font-size: 14px; cursor: pointer; touch-action: manipulation; }
.admin-btn-danger { padding: 6px 12px; border-radius: 8px; background: var(--bad); border: none; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
.admin-btn-cancel { padding: 6px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); font-size: 13px; font-weight: 600; cursor: pointer; touch-action: manipulation; }
.admin-btn-cancel.sm { padding: 5px 8px; font-size: 12px; }
.admin-btn-save { padding: 8px 16px; border-radius: 8px; background: var(--accent); border: none; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
.admin-btn-primary { width: 100%; padding: 12px; border-radius: 12px; background: var(--accent); border: none; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px; touch-action: manipulation; }
.admin-btn-primary:disabled { opacity: 0.4; }

.admin-edit-form { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.admin-edit-row { display: flex; gap: 8px; align-items: center; }
.admin-edit-actions { display: flex; gap: 8px; }
.admin-input { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 16px; font-family: 'Inter', sans-serif; font-weight: 600; width: 100%; box-sizing: border-box; outline: none; touch-action: manipulation; }
.admin-input:focus { border-color: var(--accent); }
.admin-input.emoji-input { width: 56px; text-align: center; flex-shrink: 0; font-size: 20px; }
.admin-input.flex-1 { flex: 1; min-width: 0; }
.admin-section-title { font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }

.admin-group-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 4px; }
.admin-group-head { display: flex; justify-content: space-between; align-items: flex-start; }
.admin-group-code-badge { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 2px 10px; font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.admin-group-display-name { font-size: 15px; font-weight: 700; margin-top: 4px; }
.admin-group-members { margin-top: 12px; }
.admin-members-label { font-size: 11px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.admin-members-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.admin-member-chip { padding: 6px 12px; border-radius: 20px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); font-size: 13px; font-weight: 600; cursor: pointer; touch-action: manipulation; }
.admin-member-chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.admin-new-group-form { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ===== Hoy ya entrenaste ===== */
.today-done {
  display: flex; flex-direction: column; align-items: center;
  padding: 48px 24px 32px; text-align: center; gap: 8px;
}
.done-trophy { font-size: 64px; margin-bottom: 6px; }
.done-msg { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; color: var(--accent); }
.done-routine { font-size: 16px; color: var(--text-2); font-weight: 600; margin-top: 2px; }
.done-stats { font-size: 14px; color: var(--text-3); display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
.done-add-btn { margin-top: 20px; width: 100%; max-width: 320px; }
.btn-outline { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); border-radius: 14px; padding: 14px 20px; font-size: 16px; font-weight: 700; cursor: pointer; touch-action: manipulation; }

/* ===== Botones agregar dentro de sesión ===== */
.add-item-btn {
  width: 100%; padding: 11px 16px; margin: 6px 0;
  background: var(--surface-2); border: 1.5px dashed var(--border-strong);
  border-radius: 12px; color: var(--text-3); font-size: 14px; font-weight: 600;
  cursor: pointer; touch-action: manipulation; transition: color 0.15s, border-color 0.15s;
}
.add-item-btn:active { color: var(--accent); border-color: var(--accent); }

/* ===== AddExercise / AddActivity search input ===== */
.add-search-input {
  width: 100%; padding: 12px 14px; margin: 0 0 8px;
  background: var(--surface-2); border: 1px solid var(--border-strong);
  border-radius: 10px; color: var(--text); font-size: 15px; outline: none;
  caret-color: var(--accent);
}

/* ===== Calendario – estadísticas semanales ===== */
.cal-week-stats {
  margin: 0 16px 4px; padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
}
.cal-week-title { font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }
.cal-week-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.week-stat { text-align: center; }
.week-stat-num { font-size: 22px; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: var(--accent); line-height: 1; }
.week-stat-label { font-size: 10px; color: var(--text-3); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.05em; }

/* ===== Medidas – actividades extra del perfil ===== */
.profile-field-label { font-size: 12px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin: 12px 0 6px; }
.extra-acts-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.extra-act-chip { padding: 6px 12px; border-radius: 20px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); font-size: 13px; font-weight: 600; cursor: pointer; touch-action: manipulation; }
.extra-act-chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.profile-extra-acts { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 0 4px; }

.admin-toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 600; z-index: 999; box-shadow: 0 4px 20px rgba(0,0,0,.4); pointer-events: none; }

/* ===== Semana – tabs internos ===== */
.week-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--surface);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 12px;
  flex-shrink: 0;
}
.week-tab {
  background: transparent;
  border: 0;
  color: var(--text-3);
  padding: 9px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.week-tab.on {
  background: var(--surface-3);
  color: var(--text);
}

/* ===== Catálogo de ejercicios ===== */
.cat-group-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.cat-group-head {
  display: flex;
  align-items: center;

  text-align: left;
}
.cat-group-head:active { background: var(--surface-2); }
.cat-group-day {
  font-size: 10px;
  color: var(--text-3);

  letter-spacing: 0.1em;

  margin-bottom: 2px;
}
.cat-group-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}

}

  font-size: 12px;
  color: var(--text-3);

}
.cat-ex-row {
  display: flex;

  gap: 10px;
  padding: 6px 0;

}

.cat-ex-num {
  font-size: 10px;
  color: var(--text-3);
  font-weight: 700;

  text-align: center;
}
.cat-ex-info { flex: 1; min-width: 0; }
.cat-ex-name { font-size: 14px; font-weight: 700; color: var(--text); }
.cat-ex-sub { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.cat-ex-spec {

.cat-ex-routine { color: var(--accent); }
.cat-acts-label {
  font-size: 10px;
  color: var(--text-3);
  text-transform: uppercase;

  font-weight: 700;

/* ===== Editor: toggle peso corporal ===== */
.editor-bw-toggle {
  margin-top: 6px;

  padding: 6px 10px;
  border-radius: 8px;
  background: var(--surface-3);
  border: 1px solid var(--border);

  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;

}

  border-color: var(--accent);

}
.editor-bw-badge {

/* ===== Múltiples sesiones por día ===== */

  width: 100%;
  max-width: 340px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 4px;
}

}
.done-session-label {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);

  font-weight: 600;

.cal-multi-badge {

  font-weight: 700;

  display: flex;
  flex-direction: column;
  gap: 6px;
}
.session-editor-row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 10px;
  flex-wrap: wrap;
}
.session-editor-name {
  flex: 1;
  min-width: 100px;
  font-size: 13px;
  color: var(--text);
  font-weight: 600;
}
.session-editor-controls {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}
.mini-step {
  width: 26px; height: 26px;
  border-radius: 6px;
  border: 0;
  background: var(--surface-3);
  color: var(--text);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
.mini-val {
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text);
  min-width: 42px;
  text-align: center;
}
.mini-val small { color: var(--text-3); font-size: 10px; }
.mini-check {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1px solid var(--border-strong);
  background: transparent;
  color: transparent;
  cursor: pointer;
  font-weight: 700;
}
.mini-check.on {
  background: var(--good, #4ade80);
  border-color: var(--good, #4ade80);
  color: #0a0a0b;
}
.mini-x {
  width: 26px; height: 26px;
  border-radius: 6px;
  border: 0;
  background: transparent;
  color: var(--text-3);
  cursor: pointer;
  font-size: 12px;
}
.mini-x:hover {
  color: var(--bad, #ff6060);
  background: rgba(255,96,96,0.1);
}

/* ─── Daily summary (kcal quemadas / consumidas / net) ─────────────── */
.daily-summary {
  background: linear-gradient(145deg, var(--surface-2), var(--surface));
  border: 1px solid var(--border);
  border-radius: 16px;
  margin-bottom: 14px;
  overflow: hidden;
}
.daily-summary-head {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: transparent;
  border: 0;
  cursor: pointer;
  color: var(--text);
  text-align: left;
}
.ds-head-block {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: flex-start;
}
.ds-head-num {
  font-size: 20px;
  font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text);
}
.ds-head-num.ds-good { color: var(--good, #4ade80); }
.ds-head-num.ds-warn { color: var(--warn, #fbbf24); }
.ds-head-lbl {
  font-size: 10px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
}
.ds-arrow {
  color: var(--text-3);
  font-size: 16px;
  padding-left: 4px;
}
.daily-summary-body {
  padding: 4px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  border-top: 1px solid var(--border);
}
.ds-target {
  background: var(--surface-3);
  border-radius: 12px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.ds-target-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-2);
}
.ds-target-row.small { font-size: 11px; color: var(--text-3); }
.ds-target-row strong { color: var(--text); }
.ds-progress-track {
  height: 6px;
  background: var(--surface);
  border-radius: 4px;
  overflow: hidden;
}
.ds-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2, var(--accent)));
  border-radius: 4px;
  transition: width 0.3s ease;
}
.ds-progress-fill.over {
  background: var(--warn, #fbbf24);
}
.ds-hint {
  font-size: 12px;
  color: var(--text-3);
  padding: 8px 4px;
  background: var(--surface-3);
  border-radius: 8px;
  text-align: center;
}
.ds-section-title {
  font-size: 10px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  font-weight: 700;
  margin-top: 4px;
}
.ds-quick-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 6px;
}
.ds-quick-btn {
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 10px;
  color: var(--text);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  text-align: left;
}
.ds-quick-btn:hover { border-color: var(--accent); }
.ds-quick-name { font-size: 12px; font-weight: 600; }
.ds-quick-kcal { font-size: 11px; color: var(--accent); font-family: 'JetBrains Mono', monospace; }
.ds-custom-form {
  display: flex;
  gap: 6px;
}
.ds-custom-input {
  flex: 1;
  min-width: 0;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 10px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  outline: none;
}
.ds-custom-input:focus { border-color: var(--accent); }
.ds-custom-kcal { max-width: 80px; text-align: center; }
.ds-custom-add {
  width: 40px; height: 40px;
  border-radius: 10px;
  border: 0;
  background: var(--accent);
  color: #fff;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
}
.ds-custom-add:disabled { opacity: 0.4; cursor: not-allowed; }
.ds-food-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.ds-food-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: var(--surface-3);
  border-radius: 8px;
  font-size: 12px;
}
.ds-food-name { flex: 1; color: var(--text); }
.ds-food-kcal { color: var(--accent); font-family: 'JetBrains Mono', monospace; font-weight: 700; }
.ds-food-rm {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 0;
  background: transparent;
  color: var(--text-3);
  cursor: pointer;
  font-size: 11px;
}
.ds-food-rm:hover { color: var(--bad, #ff6060); background: rgba(255,96,96,0.1); }

/* ─── Charts ──────────────────────────────────────────────────────── */
.chart-empty {
  padding: 24px 16px;
  text-align: center;
  color: var(--text-3);
  font-size: 13px;
  background: var(--surface-2);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.chart-empty-ic { font-size: 26px; }
.body-chart {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 14px 10px;
  margin-bottom: 12px;
}
.body-chart-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 8px;
}
.body-chart-num {
  font-size: 28px;
  font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text);
}
.body-chart-num span { font-size: 13px; color: var(--text-3); font-weight: 500; margin-left: 2px; }
.body-chart-sub { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.4px; }
.body-chart-delta {
  text-align: right;
  font-size: 12px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-2);
}
.body-chart-delta.good { color: var(--good, #4ade80); }
.body-chart-delta.warn { color: var(--warn, #fbbf24); }
.body-chart-delta span { display: block; font-size: 10px; color: var(--text-3); font-weight: 400; margin-top: 1px; }
.body-chart-legend {
  display: flex;
  gap: 12px;
  font-size: 10px;
  color: var(--text-3);
  margin-top: 4px;
  flex-wrap: wrap;
}
.body-chart-legend span { display: flex; align-items: center; gap: 4px; }
.legend-dot {
  width: 6px; height: 6px; border-radius: 50%;
  display: inline-block;
}
.legend-line { width: 12px; height: 2px; display: inline-block; border-top: 1.5px dashed; }
.legend-accent { background: var(--accent); border-color: var(--accent); color: var(--accent); }
.legend-good { background: rgba(74,222,128,0.6); }
.legend-swatch {
  width: 10px; height: 10px; border-radius: 2px;
  display: inline-block;
}
.legend-burn { background: var(--accent); }
.legend-food { background: rgba(96,165,250,0.75); }

.wk-chart {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 14px 12px;
  margin-bottom: 12px;
}
.wk-chart-head {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 10px;
}
.wk-chart-num {
  font-size: 22px;
  font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  color: var(--accent);
}
.wk-chart-sub { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; }
.wk-chart-bars {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 110px;
  padding: 0 2px;
}
.wk-bar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
  gap: 2px;
}
.wk-bar-stack {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 2px;
}
.wk-bar {
  width: 8px;
  border-radius: 3px 3px 0 0;
  transition: height 0.3s;
  min-height: 2px;
}
.wk-bar-burn { background: var(--accent); }
.wk-bar-food { background: rgba(96,165,250,0.75); }
.wk-bar-lbl {
  font-size: 9px;
  color: var(--text-3);
  text-transform: uppercase;
  font-weight: 600;
}
.wk-chart-legend {
  display: flex;
  gap: 12px;
  font-size: 10px;
  color: var(--text-3);
  margin-top: 8px;
}
.wk-chart-legend span { display: flex; align-items: center; gap: 4px; }

.streak-grid-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
}
.streak-grid-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 12px;
}
.streak-grid-num {
  font-size: 28px;
  font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  color: var(--accent);
}
.streak-grid-num span { font-size: 15px; }
.streak-grid-sub { font-size: 11px; color: var(--text-3); }
.streak-grid-stats {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 11px;
  color: var(--text-3);
  text-align: right;
}
.streak-grid-stats strong { color: var(--text); font-family: 'JetBrains Mono', monospace; }
.streak-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 4px;
}
.streak-cell {
  aspect-ratio: 1;
  border-radius: 4px;
  background: var(--surface-3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--text-3);
}
.streak-cell.streak-done { background: var(--accent); color: #fff; }
.streak-cell.streak-partial { background: rgba(236,96,50,0.35); color: var(--text); }
.streak-cell.streak-missed { background: rgba(255,96,96,0.12); }
.streak-cell.streak-rest { background: var(--surface); border: 1px dashed var(--border); }

/* ─── Coach IA ────────────────────────────────────────────────────── */
.coach-panel {
  background: linear-gradient(135deg, rgba(236,96,50,0.06), rgba(76,29,149,0.06));
  border: 1px solid var(--border);
  border-radius: 16px;
  margin-bottom: 14px;
  overflow: hidden;
}
.coach-panel.is-open { border-color: var(--accent); }
.coach-head {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: transparent;
  border: 0;
  cursor: pointer;
  color: var(--text);
  text-align: left;
  font-size: 14px;
  font-weight: 700;
}
.coach-icon { font-size: 20px; }
.coach-title { flex: 1; display: flex; align-items: center; gap: 8px; }
.coach-badge-ai {
  font-size: 9px;
  background: linear-gradient(135deg, var(--accent), #8b5cf6);
  color: #fff;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 800;
  letter-spacing: 0.4px;
}
.coach-arrow { color: var(--text-3); font-size: 16px; }
.coach-body {
  padding: 4px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-top: 1px solid var(--border);
}
.coach-loading {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 4px;
  color: var(--text-3);
  font-size: 12px;
}
.coach-error {
  padding: 12px;
  background: rgba(255,96,96,0.08);
  border-radius: 10px;
  font-size: 12px;
  color: var(--text-2);
  text-align: center;
}
.coach-headline {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  padding: 10px 12px;
  background: var(--surface-3);
  border-radius: 10px;
  border-left: 3px solid var(--accent);
}
.coach-section {
  font-size: 10px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  font-weight: 700;
  margin-top: 6px;
}
.coach-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.coach-item {
  padding: 8px 10px;
  background: var(--surface-3);
  border-radius: 8px;
}
.coach-item-name {
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
}
.coach-item-sub {
  font-size: 11px;
  color: var(--text-2);
  margin-top: 2px;
}
.coach-tips {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.coach-tips li {
  padding: 8px 10px;
  background: var(--surface-3);
  border-radius: 8px;
  font-size: 12px;
  color: var(--text);
  position: relative;
  padding-left: 24px;
}
.coach-tips li::before {
  content: "💡";
  position: absolute;
  left: 8px;
  top: 8px;
}
.coach-focus {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: rgba(236,96,50,0.08);
  border: 1px dashed var(--accent);
  border-radius: 8px;
  font-size: 12px;
  color: var(--text);
}
.coach-focus-icon { font-size: 14px; }
.coach-refresh {
  align-self: flex-start;
  font-size: 11px;
  padding: 4px 0;
}

/* ─── Confirm modal ────────────────────────────────────────────────── */
.confirm-backdrop {
  z-index: 1200;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(4px);
}
.confirm-sheet {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 22px 20px 16px;
  width: min(340px, calc(100vw - 32px));
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  animation: confirm-in 0.15s ease-out;
}
@keyframes confirm-in {
  from { transform: scale(0.94); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
.confirm-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}
.confirm-body {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.45;
  margin-bottom: 18px;
}
.confirm-actions {
  display: flex;
  gap: 8px;
}
.confirm-btn {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 0;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: filter 0.15s, transform 0.05s;
}
.confirm-btn:active { transform: scale(0.97); }
.confirm-cancel {
  background: var(--surface-3);
  color: var(--text);
}
.confirm-ok {
  background: var(--accent);
  color: #fff;
}
.confirm-ok.is-danger {
  background: var(--bad, #ef4444);
}
.confirm-ok:hover, .confirm-cancel:hover { filter: brightness(1.1); }

/* ─── Toasts (snackbar) ─────────────────────────────────────────── */
.toast-host {
  position: fixed;
  bottom: calc(96px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  z-index: 1100;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
  width: 100%;
  max-width: 380px;
  padding: 0 12px;
  box-sizing: border-box;
}
.toast {
  pointer-events: auto;
  background: var(--surface-3);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
  font-size: 13px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  animation: toast-in 0.2s ease-out;
  min-width: 240px;
  max-width: 100%;
  box-sizing: border-box;
}
@keyframes toast-in {
  from { transform: translateY(20px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
.toast-text { flex: 1; min-width: 0; }
.toast-action {
  background: transparent;
  border: 0;
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
}
.toast-action:hover { background: rgba(236,96,50,0.12); }
.toast-dismiss {
  background: transparent;
  border: 0;
  color: var(--text-3);
  font-size: 12px;
  cursor: pointer;
  padding: 4px 6px;
}
.toast-info { border-color: var(--border-strong); }
.toast-success { border-color: var(--good, #4ade80); }
.toast-error   { border-color: var(--bad, #ef4444); }

/* ─── Safe boundary placeholder ────────────────────────────────────── */
.safe-boundary {
  display: flex;
  gap: 10px;
  background: var(--surface-2);
  border: 1px dashed var(--border-strong);
  border-radius: 12px;
  padding: 12px;
  color: var(--text-2);
  font-size: 12px;
  align-items: center;
}
.safe-boundary button {
  background: transparent;
  border: 0;
  color: var(--accent);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 0;
}

/* ─── Skeletons ─────────────────────────────────────────────────────── */
@keyframes skel-shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
.skel {
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
  background-size: 200% 100%;
  animation: skel-shimmer 1.4s ease-in-out infinite;
  border-radius: 8px;
  height: 14px;
  display: block;
}
.skel.skel-title { height: 20px; width: 60%; margin-bottom: 6px; }
.skel.skel-line  { height: 12px; margin-bottom: 4px; }
.skel-row {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 8px;
}
.skel-row .skel-box { width: 38px; height: 42px; border-radius: 8px; }
.skel-row .skel-body { flex: 1; }

/* mood-badge que es botón */
button.mood-badge {
  cursor: pointer;
  border: 0;
  font-family: inherit;
}
button.mood-badge:hover { filter: brightness(1.1); }
.mood-opt.is-selected { outline: 2px solid var(--accent); outline-offset: -2px; }

/* Tab transition */
.app-scroll {
  animation: tab-fade 0.18s ease-out;
}
/* Sin transform aquí: transform en el scroll parent rompe position:fixed
   de modales anidados (containing block issue). Fade solo con opacity. */
@keyframes tab-fade {
  from { opacity: 0.65; }
  to   { opacity: 1; }
}

</style>

// === data/seed-history.js ===
// Datos de ejemplo para ver progreso inmediato al abrir la app
// Se cargan en localStorage en el primer arranque si no hay datos
window.SEED_HISTORY = (() => {
  const today = new Date();
  const dayMs = 86400000;
  const iso = d => {
    const x = new Date(d);
    return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
  };
  const sessions = {};
  // Últimas 3 semanas de datos sintéticos en días entre semana pasados
  const routine = window.WEEK_ROUTINE;
  for (let back = 1; back <= 21; back++) {
    const d = new Date(today.getTime() - back * dayMs);
    const dow = d.getDay();
    if (dow === 0) continue; // domingo descanso
    const day = routine[dow];
    if (!day || day.rest) continue;
    // ~85% asistencia
    if (Math.random() > 0.85) continue;
    const mood = ['strong', 'normal', 'normal', 'strong', 'normal', 'sick'][Math.floor(Math.random() * 6)];
    const exs = day.exercises.map(ex => {
      // pequeño drift en peso para ver tendencias
      const drift = Math.random() * 0.12 - 0.04;
      const w = Math.max(0, Math.round(ex.weight * (1 + drift) / 2.5) * 2.5);
      const completedSets = Math.random() > 0.15 ? ex.sets : Math.max(1, ex.sets - 1);
      return {
        id: ex.id,
        weight: w,
        sets: completedSets,
        targetSets: ex.sets,
        reps: ex.reps,
        done: completedSets === ex.sets
      };
    });
    sessions[iso(d)] = {
      date: iso(d),
      dow,
      title: day.title,
      mood,
      exercises: exs,
      cardioDone: Math.random() > 0.3,
      completed: exs.every(e => e.done)
    };
  }
  return sessions;
})();

// === data/api-store.js ===
// data/api-store.js — Cliente REST robusto para el servidor (EC2 → DynamoDB).
//
// Features:
//   - Debounce 250 ms para evitar spam de PUT en cambios rápidos.
//   - fetch con keepalive: la escritura sobrevive a reload y pagehide.
//   - Backup en localStorage de la cola pendiente → reintenta al cargar la app.
//   - Listeners pagehide + visibilitychange para flush al salir.
//   - Reintentos con backoff exponencial + jitter si el servidor responde no-OK.
//   - Autenticación via Bearer token (opcional; GET público).
//   - Handler global de 401: dispara evento window 'ponteviga:auth-expired'.
window.S3Store = (() => {
  'use strict';

  if (!window.__SERVER_STORAGE__) {
    return {
      get: async () => null,
      set: () => Promise.resolve(),
      flush: async () => {},
      setToken: () => {},
      getToken: () => null,
      hasPendingWrites: () => false
    };
  }
  const baseUrl = window.__SERVER_CONFIG__ && window.__SERVER_CONFIG__.apiUrl || '';
  const DEBOUNCE_MS = 250;
  const PENDING_LS_KEY = '__pv_pending_writes_v1';
  const TOKEN_LS_KEY = '__pv_auth_token_v1';
  const MAX_RETRIES = 5;
  console.log('[Storage] Modo servidor activo. baseUrl:', baseUrl || '(same-origin)');
  const queue = {};
  const timers = {};
  let currentToken = null;
  try {
    currentToken = localStorage.getItem(TOKEN_LS_KEY) || null;
  } catch {}

  // ── Token ──────────────────────────────────────────────────────
  function setToken(token) {
    currentToken = token || null;
    try {
      if (token) localStorage.setItem(TOKEN_LS_KEY, token);else localStorage.removeItem(TOKEN_LS_KEY);
    } catch {}
  }
  function getToken() {
    return currentToken;
  }
  function _authHeaders() {
    return currentToken ? {
      'Authorization': `Bearer ${currentToken}`
    } : {};
  }
  function _fireAuthExpired(reason) {
    try {
      window.dispatchEvent(new CustomEvent('ponteviga:auth-expired', {
        detail: {
          reason
        }
      }));
    } catch {}
  }

  // ── Backup en localStorage ────────────────────────────────────
  function _persistPending() {
    try {
      localStorage.setItem(PENDING_LS_KEY, JSON.stringify(queue));
    } catch {}
  }
  function _clearPersistedKey(key) {
    try {
      const raw = localStorage.getItem(PENDING_LS_KEY);
      if (!raw) return;
      const obj = JSON.parse(raw);
      delete obj[key];
      if (Object.keys(obj).length === 0) localStorage.removeItem(PENDING_LS_KEY);else localStorage.setItem(PENDING_LS_KEY, JSON.stringify(obj));
    } catch {}
  }
  function _restorePending() {
    try {
      const raw = localStorage.getItem(PENDING_LS_KEY);
      if (!raw) return;
      const obj = JSON.parse(raw);
      Object.keys(obj).forEach(k => {
        queue[k] = obj[k];
        _flush(k);
      });
    } catch {}
  }

  // Backoff: 300ms, 700ms, 1500ms, 3200ms, 6500ms + jitter
  function _backoff(attempt) {
    const base = 300 * Math.pow(2.15, attempt - 1);
    return Math.round(base + Math.random() * 200);
  }

  // ── Escritura con reintentos ─────────────────────────────────
  async function _flush(key, attempt = 1) {
    const data = queue[key];
    if (data === undefined) return;
    try {
      const url = `${baseUrl}/data/${key}.json`;
      const r = await fetch(url, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          ..._authHeaders()
        },
        body: JSON.stringify(data),
        keepalive: true
      });
      if (r.status === 401) {
        console.warn('[Storage] 401 — token expirado o inválido');
        _fireAuthExpired('write_401');
        // Mantener en queue para reintento tras re-login
        _persistPending();
        return;
      }
      if (r.status === 403) {
        console.error('[Storage] 403 forbidden en PUT', key);
        // No reintentar; el token no tiene permisos para esta clave
        delete queue[key];
        _clearPersistedKey(key);
        return;
      }
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      if (queue[key] === data) {
        delete queue[key];
        _clearPersistedKey(key);
      }
    } catch (e) {
      console.warn(`[Storage] error escribiendo ${key} (intento ${attempt}):`, e.message);
      _persistPending();
      if (attempt < MAX_RETRIES) {
        setTimeout(() => _flush(key, attempt + 1), _backoff(attempt));
      } else {
        console.error(`[Storage] escritura ${key} fallida tras ${MAX_RETRIES} intentos`);
      }
    }
  }
  async function get(key, opts) {
    const attempt = opts && opts.attempt || 1;
    try {
      const url = `${baseUrl}/data/${key}.json`;
      const r = await fetch(url, {
        headers: _authHeaders()
      });
      if (r.status === 404) return null;
      if (r.status === 401) {
        _fireAuthExpired('read_401');
        return null;
      }
      if (r.status === 429) {
        // Retry con backoff si hay margen
        if (attempt < 3) {
          const retryAfter = parseInt(r.headers.get('Retry-After') || '2', 10) * 1000;
          await new Promise(res => setTimeout(res, retryAfter));
          return get(key, {
            attempt: attempt + 1
          });
        }
        console.warn('[Storage] rate limited leyendo', key);
        return null;
      }
      if (!r.ok) {
        console.warn('[Storage] error leyendo', key, r.status);
        return null;
      }
      const data = await r.json();
      // Validaciones ligeras
      if (key.endsWith('_sessions') && (data === null || typeof data !== 'object' || Array.isArray(data))) return null;
      if (key === 'profiles' && !Array.isArray(data)) return null;
      if (key.endsWith('_measures') && !Array.isArray(data)) return null;
      return data;
    } catch (e) {
      console.warn('[Storage] error parseando', key, e.message);
      // Retry transient network errors
      if (attempt < 3) {
        await new Promise(res => setTimeout(res, _backoff(attempt)));
        return get(key, {
          attempt: attempt + 1
        });
      }
      return null;
    }
  }
  function set(key, data) {
    queue[key] = data;
    _persistPending();
    clearTimeout(timers[key]);
    timers[key] = setTimeout(() => _flush(key), DEBOUNCE_MS);
    return Promise.resolve();
  }
  async function flush() {
    return Promise.all(Object.keys(queue).map(k => _flush(k)));
  }
  function hasPendingWrites() {
    return Object.keys(queue).length > 0;
  }
